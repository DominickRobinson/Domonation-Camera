name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Domonation-Camera-latest.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Domonation-Camera-${{ github.sha }}
          path: Domonation-Camera-latest.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Domonation-Camera-${{ github.sha }}

      - name: Create or update Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="${GITHUB_SHA}" -F force=true
            gh release edit latest \
              --title "Domonation Camera latest" \
              --notes "Automatic debug build from commit ${GITHUB_SHA}." \
              --latest
            gh release upload latest Domonation-Camera-latest.apk --clobber
          else
            gh release create latest Domonation-Camera-latest.apk \
              --target "${GITHUB_SHA}" \
              --title "Domonation Camera latest" \
              --notes "Automatic debug build from commit ${GITHUB_SHA}." \
              --latest
          fi

      - name: Create versioned release when new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        shell: bash
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "$VERSION_TAG already exists; leaving it unchanged."
            exit 0
          fi

          cp Domonation-Camera-latest.apk "Domonation-Camera-${VERSION_TAG}.apk"
          prerelease=""
          if [[ "$VERSION_NAME" == 0.* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$VERSION_TAG" \
            "Domonation-Camera-${VERSION_TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Domonation Camera ${VERSION_NAME}" \
            --generate-notes \
            $prerelease
